spring.datasource.url=jdbc:postgresql://localhost:5433/pawnwhop
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# DATABASE USERS
# ============================================================

app.datasource.admin.username=pawnwhop_admin
app.datasource.admin.password=admin123

app.datasource.operator.username=pawnwhop_operator
app.datasource.operator.password=operator123

app.datasource.analyst.username=pawnwhop_analyst
app.datasource.analyst.password=analyst123

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

